name: Build APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Unpack and commit"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar keystore de debug
        run: |
          mkdir -p app
          if [ ! -f app/sidonia.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/sidonia.keystore \
              -alias sidonia \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass sidonia123 \
              -keypass sidonia123 \
              -dname "CN=Sidonia, OU=Android, O=Sidonia, L=Brasilia, S=SP, C=BR"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Sidonia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sidonia-APK
          path: Sidonia.apk

      - name: Publicar versao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sidonia v${{ github.run_number }}
          files: Sidonia.apk
          make_latest: true
